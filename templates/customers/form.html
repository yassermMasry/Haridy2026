{{define "customers/form.html"}}
{{template "app_start" .}}
<h2 class="mb-5 text-2xl font-bold">بيانات العميل</h2>
<form method="post" action="{{.action}}" class="grid gap-4 rounded-lg border bg-white p-5 md:grid-cols-2">
<input type="hidden" name="_csrf" value="{{.csrf}}">
<div><label class="form-label">الاسم</label><input class="form-input" name="name" value="{{.customer.Name}}" required></div>
<div><label class="form-label">الهاتف</label><input class="form-input" name="phone" value="{{.customer.Phone}}"></div>
<div><label class="form-label">الحد الائتماني</label><input class="form-input" name="credit_limit" type="number" step="0.01" value="{{.customer.CreditLimit}}"></div>
<div><label class="form-label">العنوان</label><input class="form-input" name="address" value="{{.customer.Address}}"></div>
<div class="md:col-span-2"><label class="form-label">ملاحظات</label><input class="form-input" name="notes" value="{{.customer.Notes}}"></div>
<button class="btn-primary">حفظ</button>
</form>
{{template "app_end" .}}
{{end}}
