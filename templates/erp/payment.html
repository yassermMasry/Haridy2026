{{define "erp/payment.html"}}
{{template "app_start" .}}
<h2 class="mb-5 text-2xl font-bold">سند صرف</h2>
<form method="post" action="/vouchers/payment" class="grid gap-4 rounded-lg border bg-white p-5 md:grid-cols-2"><input type="hidden" name="_csrf" value="{{.csrf}}"><div><label class="form-label">المورد</label><select class="form-input" name="supplier_id">{{range .suppliers}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></div><div><label class="form-label">المبلغ</label><input class="form-input" name="amount" type="number" step="0.01" required></div><div class="md:col-span-2"><label class="form-label">البيان</label><input class="form-input" name="description"></div><button class="btn-primary">حفظ وطباعة</button></form>
{{template "app_end" .}}
{{end}}
