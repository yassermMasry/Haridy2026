{{define "purchases/index.html"}}{{template "app_start" .}}<div class="flex justify-between"><h2 class="text-2xl font-bold">فواتير الشراء</h2><a class="btn-primary" href="/purchases/new">فاتورة شراء</a></div><div class="mt-5 overflow-x-auto rounded-lg border bg-white"><table class="min-w-full text-sm"><thead class="bg-slate-100"><tr><th>الرقم</th><th>المورد</th><th>النوع</th><th>الإجمالي</th><th></th></tr></thead><tbody>{{range .invoices}}<tr class="border-t"><td>{{.Number}}</td><td>{{.Supplier.Name}}</td><td>{{.PaymentType}}</td><td>{{printf "%.2f" .Total}}</td><td><a class="btn-light" href="/purchases/{{.ID}}">عرض</a></td></tr>{{else}}<tr><td colspan="5" class="p-8 text-center text-slate-500">لا توجد مشتريات</td></tr>{{end}}</tbody></table></div>{{template "app_end" .}}{{end}}
