{{define "auth/login.html"}}
{{template "head" .}}
<body class="min-h-screen bg-slate-950">
  <main class="grid min-h-screen place-items-center px-4">
    <form method="post" action="/login" class="w-full max-w-md rounded-lg bg-white p-8 shadow-2xl">
      <input type="hidden" name="_csrf" value="{{.csrf}}">
      <div class="mb-8">
        <p class="text-sm font-semibold text-emerald-600">Haridy Inventory</p>
        <h1 class="mt-2 text-3xl font-bold text-slate-950">تسجيل الدخول</h1>
      </div>
      {{if .flash}}<div class="mb-4 rounded-md bg-red-50 px-4 py-3 text-sm text-red-700">{{.flash}}</div>{{end}}
      <label class="form-label">اسم المستخدم</label>
      <input name="username" class="form-input" value="admin" required autofocus>
      <label class="form-label mt-4">كلمة المرور</label>
      <input name="password" type="password" class="form-input" value="admin123" required>
      <button class="mt-6 w-full rounded-md bg-emerald-600 px-4 py-3 font-bold text-white hover:bg-emerald-700">دخول</button>
    </form>
  </main>
</body>
</html>
{{end}}
