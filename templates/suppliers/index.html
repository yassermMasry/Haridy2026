{{define "suppliers/index.html"}}{{template "app_start" .}}<div class="flex justify-between"><h2 class="text-2xl font-bold">الموردون</h2><a class="btn-primary" href="/suppliers/new">إضافة مورد</a></div><div class="mt-5 overflow-x-auto rounded-lg border bg-white"><table class="min-w-full text-sm"><thead class="bg-slate-100"><tr><th>الاسم</th><th>الهاتف</th><th>الرصيد</th><th></th></tr></thead><tbody>{{range .suppliers}}<tr class="border-t"><td>{{.Name}}</td><td>{{.Phone}}</td><td>{{printf "%.2f" .Balance}}</td><td class="flex gap-2"><a class="btn-light" href="/suppliers/{{.ID}}">كشف</a><a class="btn-light" href="/suppliers/{{.ID}}/edit">تعديل</a></td></tr>{{else}}<tr><td colspan="4" class="p-8 text-center text-slate-500">لا يوجد موردون</td></tr>{{end}}</tbody></table></div>{{template "app_end" .}}{{end}}
