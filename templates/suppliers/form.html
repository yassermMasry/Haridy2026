{{define "suppliers/form.html"}}{{template "app_start" .}}<h2 class="mb-5 text-2xl font-bold">بيانات المورد</h2><form method="post" action="{{.action}}" class="grid gap-4 rounded-lg border bg-white p-5 md:grid-cols-2"><input type="hidden" name="_csrf" value="{{.csrf}}"><div><label class="form-label">الاسم</label><input class="form-input" name="name" value="{{.supplier.Name}}" required></div><div><label class="form-label">الهاتف</label><input class="form-input" name="phone" value="{{.supplier.Phone}}"></div><div><label class="form-label">العنوان</label><input class="form-input" name="address" value="{{.supplier.Address}}"></div><div><label class="form-label">ملاحظات</label><input class="form-input" name="notes" value="{{.supplier.Notes}}"></div><button class="btn-primary">حفظ</button></form>{{template "app_end" .}}{{end}}
